<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Users</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #0f172a;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .subtitle {
            color: #64748b;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 24px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: #64748b;
        }
        .btn-secondary:hover {
            background: #475569;
        }
        .btn-success {
            background: #22c55e;
        }
        .btn-success:hover {
            background: #16a34a;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        .loading i {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        thead {
            background: #f8fafc;
        }
        th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e2e8f0;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }
        tr:hover {
            background: #f8fafc;
        }
        .badge {
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-admin {
            background: #dbeafe;
            color: #2563eb;
        }
        .badge-customer {
            background: #d1fae5;
            color: #059669;
        }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
        .empty i {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }
        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 8px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stat-item strong {
            font-size: 20px;
            color: #0f172a;
        }
        .stat-item span {
            color: #64748b;
            font-size: 14px;
        }
        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
        .error.show {
            display: block;
        }
        .success {
            background: #d1fae5;
            color: #059669;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
        .success.show {
            display: block;
        }
        .config-info {
            background: #f1f5f9;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 13px;
            color: #475569;
            overflow-x: auto;
        }
        .config-info strong {
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span>👥</span> User Fetcher
        </h1>
        <p class="subtitle">Simple tool to fetch and view all users from your profiles table</p>

        <div class="config-info">
            <strong>Config:</strong> Make sure your <code>config.js</code> is loaded with the correct Supabase URL and anon key
        </div>

        <div class="controls">
            <button onclick="fetchUsers()" id="fetchBtn">
                <span>🔄</span> Fetch Users
            </button>
            <button class="btn-secondary" onclick="clearResults()">
                <span>🗑️</span> Clear
            </button>
            <button class="btn-success" onclick="copyToClipboard()">
                <span>📋</span> Copy JSON
            </button>
        </div>

        <div id="error" class="error"></div>
        <div id="success" class="success"></div>

        <div id="stats" class="stats" style="display: none;">
            <div class="stat-item">
                <strong id="totalUsers">0</strong>
                <span>Total Users</span>
            </div>
            <div class="stat-item">
                <strong id="adminCount">0</strong>
                <span>Admins</span>
            </div>
            <div class="stat-item">
                <strong id="customerCount">0</strong>
                <span>Customers</span>
            </div>
        </div>

        <div id="result">
            <div class="empty">
                <span>📭</span>
                <p>Click "Fetch Users" to load data</p>
            </div>
        </div>
    </div>

    <!-- Load Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Load your config -->
    <script src="../js/config.js"></script>

    <script>
        // ============================================
        // FETCH USERS FUNCTION
        // ============================================
        async function fetchUsers() {
            const fetchBtn = document.getElementById('fetchBtn');
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            const resultDiv = document.getElementById('result');
            const statsDiv = document.getElementById('stats');

            // Hide previous messages
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');
            
            // Disable button and show loading
            fetchBtn.disabled = true;
            fetchBtn.innerHTML = '<span class="spinner">⏳</span> Loading...';

            try {
                // Check if client is defined
                if (typeof client === 'undefined') {
                    throw new Error('Supabase client not initialized. Check your config.js');
                }

                console.log('Fetching users from profiles table...');

                // Fetch all profiles
                const { data: profiles, error } = await client
                    .from('profiles')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    if (error.code === '42P01') {
                        throw new Error('The "profiles" table does not exist. Please create it first.');
                    }
                    throw error;
                }

                console.log('Fetched profiles:', profiles);

                // Show success message
                successDiv.textContent = `✅ Successfully fetched ${profiles?.length || 0} users!`;
                successDiv.classList.add('show');

                // Update stats
                if (profiles && profiles.length > 0) {
                    statsDiv.style.display = 'flex';
                    document.getElementById('totalUsers').textContent = profiles.length;
                    document.getElementById('adminCount').textContent = profiles.filter(p => p.role === 'admin').length;
                    document.getElementById('customerCount').textContent = profiles.filter(p => p.role === 'customer').length;
                } else {
                    statsDiv.style.display = 'none';
                }

                // Render table
                if (profiles && profiles.length > 0) {
                    resultDiv.innerHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Full Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>National ID</th>
                                    <th>Role</th>
                                    <th>Joined</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${profiles.map((user, index) => `
                                    <tr>
                                        <td>${index + 1}</td>
                                        <td><strong>${user.full_name || 'N/A'}</strong></td>
                                        <td>${user.email || 'N/A'}</td>
                                        <td>${user.phone || 'N/A'}</td>
                                        <td>${user.national_id || 'N/A'}</td>
                                        <td><span class="badge badge-${user.role || 'customer'}">${user.role || 'customer'}</span></td>
                                        <td>${user.created_at ? new Date(user.created_at).toLocaleString() : 'N/A'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                        <div style="margin-top: 16px; padding: 12px; background: #f8fafc; border-radius: 8px; font-size: 13px; color: #64748b;">
                            <strong>💡 Tip:</strong> You can copy the data as JSON using the "Copy JSON" button above.
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="empty">
                            <span>📭</span>
                            <p>No users found in the profiles table</p>
                            <p style="font-size: 13px; margin-top: 8px; color: #94a3b8;">Try adding some users first</p>
                        </div>
                    `;
                }

            } catch (error) {
                console.error('Fetch error:', error);
                errorDiv.textContent = `❌ Error: ${error.message}`;
                errorDiv.classList.add('show');
                
                resultDiv.innerHTML = `
                    <div class="empty">
                        <span>⚠️</span>
                        <p>Failed to fetch users</p>
                        <p style="font-size: 13px; margin-top: 8px; color: #94a3b8;">${error.message}</p>
                    </div>
                `;
            } finally {
                // Re-enable button
                fetchBtn.disabled = false;
                fetchBtn.innerHTML = '<span>🔄</span> Fetch Users';
            }
        }

        // ============================================
        // CLEAR RESULTS
        // ============================================
        function clearResults() {
            const resultDiv = document.getElementById('result');
            const statsDiv = document.getElementById('stats');
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');

            resultDiv.innerHTML = `
                <div class="empty">
                    <span>📭</span>
                    <p>Click "Fetch Users" to load data</p>
                </div>
            `;
            statsDiv.style.display = 'none';
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');
        }

        // ============================================
        // COPY TO CLIPBOARD
        // ============================================
        async function copyToClipboard() {
            try {
                const { data: profiles } = await client
                    .from('profiles')
                    .select('*');

                if (!profiles || profiles.length === 0) {
                    alert('No data to copy. Fetch users first!');
                    return;
                }

                const jsonData = JSON.stringify(profiles, null, 2);
                await navigator.clipboard.writeText(jsonData);
                
                const successDiv = document.getElementById('success');
                successDiv.textContent = '✅ Data copied to clipboard as JSON!';
                successDiv.classList.add('show');
                
                setTimeout(() => {
                    successDiv.classList.remove('show');
                }, 3000);
            } catch (error) {
                console.error('Copy error:', error);
                alert('Failed to copy data. You can select and copy the table manually.');
            }
        }

        // ============================================
        // AUTO-FETCH ON LOAD
        // ============================================
        // Uncomment the line below to auto-fetch when page loads
        // window.onload = () => setTimeout(fetchUsers, 500);
    </script>
</body>
</html>
