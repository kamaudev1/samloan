<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sam Loans Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="admin">
        
        <!-- ============================================
             SIDEBAR OVERLAY (Mobile backdrop)
             ============================================ -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- ============================================
             SIDEBAR
             ============================================ -->
        <aside id="sidebar">
            <div class="logo">
                <i class="fa-solid fa-building-columns"></i>
                <h2>Sam Loans</h2>
                <!-- Sidebar close button (mobile) -->
                <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <ul>
                <li class="active" data-page="dashboard">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Dashboard</span>
                </li>
                <li data-page="customers">
                    <i class="fa-solid fa-users"></i>
                    <span>Customers</span>
                </li>
                <li data-page="applications">
                    <i class="fa-solid fa-file-signature"></i>
                    <span>Applications</span>
                </li>
                <li data-page="loans">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Loans</span>
                </li>
                <li data-page="payments">
                    <i class="fa-solid fa-money-bill-wave"></i>
                    <span>Payments</span>
                </li>
                <li data-page="reports">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Reports</span>
                </li>
                <li data-page="settings">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </li>
                <li id="logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </li>
            </ul>
        </aside>

        <!-- ============================================
             MAIN CONTENT
             ============================================ -->
        <main>
            <header>
                <div class="header-left">
                    <!-- Mobile menu toggle button -->
                    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle sidebar">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div>
                        <h1 id="pageTitle">Dashboard</h1>
                        <p id="welcomeAdmin">Welcome</p>
                    </div>
                </div>
                <div class="admin-profile">
                    <span class="avatar">A</span>
                    <span id="adminName">Admin</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
            </header>
            <section id="content">
                <!-- Dynamic content loads here -->
                <div class="loading-spinner">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    Loading...
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/adminGuard.js"></script>
    <script src="../js/admin.js"></script>
</body>

</html>
