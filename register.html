<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Sam Loans</title>

<link rel="stylesheet" href="css/auth.css">

</head>

<body>

<div class="auth-container">

<div class="auth-card">

<h2>Create Your Account</h2>

<p>Start your journey with Sam Loans.</p>

<form id="registerForm">

<input
type="text"
id="fullName"
placeholder="Full Name"
required>

<input
type="email"
id="email"
placeholder="Email Address"
autocomplete="email"
required>

<input
type="tel"
id="phone"
placeholder="Phone Number"
required>

<input
type="text"
id="nationalId"
placeholder="National ID Number"
required>

<input
type="password"
id="password"
placeholder="Password"
autocomplete="new-password"
required>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
autocomplete="new-password"
required>

<label class="terms">

<input
type="checkbox"
id="terms"
required>

I agree to the Terms & Conditions

</label>

<button type="submit">

Create Account

</button>

</form>

<p id="message"></p>

<p class="bottom">

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/register.js"></script>

</body>
</html>
